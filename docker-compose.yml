# Optional PostgreSQL for the `postgres` Spring profile.
# The application runs on embedded H2 by default and does not need this.
#
#   docker compose up -d
#   cd backend && mvn spring-boot:run -Dspring-boot.run.profiles=postgres
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
