spring:
  application:
    name: customer-activity-analytics

  datasource:
    # Zero-setup default: file-based H2 in PostgreSQL compatibility mode.
    # Switch to a real PostgreSQL with --spring.profiles.active=postgres (see below).
    url: jdbc:h2:file:./data/analytics;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate neither creates nor validates it
      # (validate trips over portable-but-inexact type mappings like CHAR(2)).
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  security:
    # HMAC secret for signing JWTs. Override in any non-demo deployment:
    # APP_SECURITY_JWT_SECRET=<random 256-bit base64>
    jwt-secret: "ZGVtby1zZWNyZXQtZm9yLWFzc2lnbm1lbnQtb25seS1jaGFuZ2UtbWUtcGxlYXNlIQ=="
    jwt-ttl-minutes: 480

  ai:
    # LLM mode: AUTO (Anthropic if ANTHROPIC_API_KEY is set, otherwise stub),
    # ANTHROPIC (fail at startup if no key), or STUB (never call a real LLM).
    mode: AUTO
    anthropic:
      model: claude-opus-5
      max-output-tokens: 8192
      request-timeout-seconds: 120
    retrieval:
      top-k: 6

logging:
  level:
    com.assignment.analytics: INFO

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:analytics}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:analytics}
    password: ${DB_PASSWORD:analytics}
